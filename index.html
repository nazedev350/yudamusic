<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0613">
<title>YudaMusic</title>
<meta name="description" content="YudaMusic — pemutar musik dengan tema Neo Purple. Tidak berafiliasi dengan YouTube, YouTube Music, atau SoundCloud.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   YUDAMUSIC — Neo Purple (dark, glassmorphism)
   Variabel tema tetap dikontrol lewat data-accent & data-mode di <html>
   agar fungsi setAccent()/toggleDark() di JS tetap bekerja tanpa diubah.
   ===================================================================== */
:root{
  --c-yellow:#f8e641; --c-blue:#7c9cff; --c-green:#4fdc86; --c-purple:#a855f7; --c-pink:#ff7ac0;
  --p-50:#faf5ff; --p-100:#f3e8ff; --p-200:#e9d5ff; --p-300:#d8b4fe; --p-400:#c084fc;
  --p-500:#a855f7; --p-600:#9333ea; --p-700:#7e22ce; --p-800:#6b21a8; --p-900:#581c87;
  --lav:#b9a2ff;

  --bg:#0b0613; --bg-2:#140a24; --surface:rgba(255,255,255,.055); --surface-solid:#180e2b;
  --ink:#f1ecff; --ink-dim:#b7a9d9; --on-accent:#120822; --inv:#05030a; --inv-fg:#f1ecff;
  --field:rgba(255,255,255,.07); --ph:#8d7fb0;
  --accent:var(--c-purple); --accent-2:var(--lav); --accent-soft:rgba(168,85,247,.22);
  --blue:#8aa4ff; --accent-red:#ff5a7a;
  --err-bg:rgba(255,90,122,.16); --err-text:#ff9fb3; --scrim:rgba(5,2,12,.72);

  --glass-bd:rgba(255,255,255,.14); --glass-bd-strong:rgba(255,255,255,.22);
  --glow:0 0 0 1px rgba(255,255,255,.06),0 8px 30px rgba(88,28,135,.45);
  --glow-soft:0 4px 18px rgba(88,28,135,.3);
  --shadow:0 10px 34px rgba(5,2,15,.55); --shadow-sm:0 4px 16px rgba(5,2,15,.4); --shadow-lg:0 18px 48px rgba(5,2,15,.6);
  --border:1px solid var(--glass-bd);
  --side-w:252px; --nav-h:0px; --mini-h:0px; --r:18px; --r-sm:12px; --r-lg:26px;
  --font-display:"Poppins","Segoe UI",system-ui,sans-serif;
  --font:"Inter","Segoe UI","Helvetica Neue",Arial,system-ui,sans-serif;
  --blur:18px;
}
:root[data-accent="blue"]{--accent:var(--c-blue);--accent-2:#cdd9ff;--accent-soft:rgba(124,156,255,.22)}
:root[data-accent="green"]{--accent:var(--c-green);--accent-2:#bdf3d4;--accent-soft:rgba(79,220,134,.2)}
:root[data-accent="purple"]{--accent:var(--c-purple);--accent-2:var(--lav);--accent-soft:rgba(168,85,247,.22)}
:root[data-accent="pink"]{--accent:var(--c-pink);--accent-2:#ffd6ec;--accent-soft:rgba(255,122,192,.22)}
:root[data-accent="yellow"]{--accent:#d8b4fe;--accent-2:var(--lav);--accent-soft:rgba(168,85,247,.22)}

/* Mode terang: tetap ungu, hanya lebih cerah supaya tema tetap konsisten "Neo Purple" */
:root[data-mode="light"]{
  --bg:#f3eefb; --bg-2:#ece2fb; --surface:rgba(255,255,255,.65); --surface-solid:#ffffff;
  --ink:#241536; --ink-dim:#5c4a79; --inv:#1b0f2e; --inv-fg:#f6f0ff; --field:rgba(255,255,255,.8); --ph:#8572a6;
  --glass-bd:rgba(90,40,140,.14); --glass-bd-strong:rgba(90,40,140,.22);
  --err-bg:#ffe1e8; --err-text:#c81b4a; --scrim:rgba(40,20,60,.35);
  --shadow:0 10px 30px rgba(90,40,140,.14); --shadow-sm:0 4px 14px rgba(90,40,140,.1); --shadow-lg:0 20px 46px rgba(90,40,140,.18);
  color-scheme:light;
}
body.has-player{--mini-h:84px}
@media (max-width:767px){:root{--nav-h:84px} body.has-player{--mini-h:72px}}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);font:450 15px/1.5 var(--font);overflow-x:hidden;
  background:
    radial-gradient(1100px 620px at 85% -10%,rgba(168,85,247,.35),transparent 60%),
    radial-gradient(900px 560px at -10% 20%,rgba(124,58,237,.28),transparent 55%),
    radial-gradient(700px 500px at 50% 120%,rgba(185,162,255,.18),transparent 60%),
    var(--bg);
  background-attachment:fixed;
}
:root[data-mode="light"] body{
  background:
    radial-gradient(1100px 620px at 85% -10%,rgba(168,85,247,.18),transparent 60%),
    radial-gradient(900px 560px at -10% 20%,rgba(124,58,237,.14),transparent 55%),
    var(--bg);
  background-attachment:fixed;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
h1,h2,h3{margin:0;font-family:var(--font-display);font-weight:700;line-height:1.15;letter-spacing:-.01em}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{width:21px;height:21px;display:block;flex:none}
.muted{opacity:.68}

/* Glass utility */
.glass{background:var(--surface);backdrop-filter:blur(var(--blur)) saturate(140%);-webkit-backdrop-filter:blur(var(--blur)) saturate(140%);
  border:var(--border);box-shadow:var(--glow-soft)}

/* Layout */
.side{position:fixed;left:14px;top:14px;bottom:calc(var(--mini-h) + 14px);width:var(--side-w);padding:20px 14px;overflow-y:auto;
  z-index:20;display:flex;flex-direction:column;gap:6px;border-radius:var(--r-lg);
  background:linear-gradient(185deg,rgba(255,255,255,.08),rgba(255,255,255,.02));
  backdrop-filter:blur(var(--blur)) saturate(150%);-webkit-backdrop-filter:blur(var(--blur)) saturate(150%);
  border:1px solid var(--glass-bd);box-shadow:var(--glow)}
.content{margin-left:calc(var(--side-w) + 30px);min-width:0}
.top{position:sticky;top:14px;z-index:15;display:flex;gap:12px;align-items:center;padding:12px 18px;border-radius:var(--r-lg);margin:0 0 20px}
main{padding:0 0 calc(var(--mini-h) + var(--nav-h) + 40px);min-width:0;outline:none}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:1.2rem;font-weight:700;text-decoration:none;color:var(--inv-fg);margin-bottom:16px;letter-spacing:-.01em}
.logo i{width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,var(--accent),var(--p-700));display:grid;place-items:center;color:#fff;box-shadow:0 6px 18px rgba(168,85,247,.55)}
.logo i .ico{width:21px;height:21px}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 13px;font-weight:600;color:var(--inv-fg);width:100%;text-align:left;border-radius:var(--r-sm);
  transition:background .15s,color .15s,transform .15s;opacity:.78}
.nav-item:hover{background:rgba(255,255,255,.08);opacity:1;transform:translateX(2px)}
.nav-item.active{background:linear-gradient(135deg,var(--accent),var(--p-700));color:#fff;opacity:1;box-shadow:0 6px 20px rgba(168,85,247,.4)}
.side hr{border:0;border-top:1px solid var(--glass-bd);margin:10px 2px;width:calc(100% - 4px)}
.side .note{font-size:.72rem;opacity:.55;padding:8px 6px;line-height:1.5}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;
  background:linear-gradient(135deg,var(--accent),var(--p-700));border:0;border-radius:999px;
  box-shadow:0 8px 22px rgba(168,85,247,.4);font-weight:700;font-size:.86rem;letter-spacing:.01em;
  transition:transform .15s,box-shadow .15s;text-decoration:none;color:#fff;min-height:46px}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(168,85,247,.5)}
.btn:active{transform:translateY(0);box-shadow:0 4px 14px rgba(168,85,247,.4)}
.btn.white{background:var(--surface);color:var(--ink);backdrop-filter:blur(var(--blur));border:1px solid var(--glass-bd);box-shadow:var(--shadow-sm)}
.btn.white:hover{background:rgba(255,255,255,.12)}
.btn.red{background:linear-gradient(135deg,var(--accent-red),#c81b4a);box-shadow:0 8px 22px rgba(255,90,122,.35)}
.btn.blue{background:linear-gradient(135deg,var(--blue),#5a6fe0);color:#fff}
.btn.on{background:var(--inv);color:var(--accent-2)}
.btn:disabled{opacity:.45;cursor:default;transform:none;box-shadow:none}
.btn .ico{width:19px;height:19px}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:14px;background:var(--surface);color:var(--ink);
  border:1px solid var(--glass-bd);box-shadow:var(--shadow-sm);flex:none;backdrop-filter:blur(var(--blur));
  transition:transform .15s,box-shadow .15s,background .15s,color .15s}
.icon-btn:hover{transform:translateY(-2px);background:var(--accent-soft);color:var(--ink);box-shadow:0 8px 22px rgba(168,85,247,.3)}
.icon-btn:active{transform:translateY(0)}
.icon-btn.on,.icon-btn[aria-pressed="true"]{background:linear-gradient(135deg,var(--accent),var(--p-700));color:#fff;border-color:transparent}
.icon-btn:disabled{opacity:.35;cursor:default}
.like.liked{background:linear-gradient(135deg,var(--accent-red),#c81b4a);color:#fff;border-color:transparent}
.like.liked .ico{fill:#fff}

/* Header search */
.search-box{flex:1;min-width:0;display:flex;gap:10px;max-width:760px}
.search-box input{flex:1;min-width:0;height:50px;padding:0 18px;background:var(--field);border:1px solid var(--glass-bd);border-radius:999px;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.2);font:500 .96rem var(--font);color:var(--ink);backdrop-filter:blur(var(--blur))}
.search-box input::placeholder{color:var(--ph);font-weight:500}
.search-box input:focus{outline:none;box-shadow:inset 0 1px 3px rgba(0,0,0,.2),0 0 0 3px var(--accent-soft)}
.search-box .btn{height:50px}
.top-right{display:flex;gap:8px;margin-left:auto}
.mob-logo{display:none}
.bottom-nav{display:none}
@media (max-width:767px){
  .side{display:none}
  .content{margin-left:0;padding:0 12px}
  .top{padding:10px 14px;gap:8px;margin:10px 0 16px}
  .mob-logo{display:grid;width:42px;height:42px;flex:none;border-radius:13px;background:linear-gradient(145deg,var(--accent),var(--p-700));color:#fff;place-items:center;box-shadow:0 6px 16px rgba(168,85,247,.5)}
  .search-box .btn span{display:none}
  .search-box input{height:46px}.search-box .btn{height:46px;padding:0 14px;min-width:46px;border-radius:50%}
  .top-right{display:none}
  main{padding:0 0 calc(var(--mini-h) + var(--nav-h) + 28px)}

  /* Floating Liquid Glass bottom navigation */
  .bottom-nav{display:flex;position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));height:66px;z-index:30;
    border-radius:26px;padding:6px;gap:4px;
    background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.04));
    backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);
    border:1px solid var(--glass-bd-strong);
    box-shadow:0 16px 40px rgba(5,2,15,.5),0 0 32px rgba(168,85,247,.22),inset 0 1px 0 rgba(255,255,255,.18)}
  .bottom-nav button{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    font-size:.62rem;font-weight:700;letter-spacing:.01em;min-height:48px;border-radius:20px;color:var(--ink-dim);
    transition:color .25s ease}
  .bottom-nav button::before{content:"";position:absolute;inset:0;border-radius:20px;background:linear-gradient(135deg,var(--accent),var(--p-700));
    opacity:0;transform:scale(.7);transition:opacity .28s cubic-bezier(.34,1.56,.64,1),transform .28s cubic-bezier(.34,1.56,.64,1);z-index:-1;
    box-shadow:0 8px 20px rgba(168,85,247,.5)}
  .bottom-nav button.active{color:#fff}
  .bottom-nav button.active::before{opacity:1;transform:scale(1)}
  .bottom-nav .ico{width:21px;height:21px;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
  .bottom-nav button.active .ico{transform:translateY(-1px) scale(1.08)}
}

/* Blocks */
.panel{background:var(--surface);backdrop-filter:blur(var(--blur)) saturate(140%);-webkit-backdrop-filter:blur(var(--blur)) saturate(140%);
  border:1px solid var(--glass-bd);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:22px}
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:22px;margin-bottom:34px}
.hero-main{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--p-700),var(--p-500) 55%,var(--lav));
  color:#fff;border-radius:var(--r-lg);box-shadow:var(--glow);padding:34px}
.hero-main::after{content:"";position:absolute;inset:0;background:radial-gradient(420px 260px at 85% -10%,rgba(255,255,255,.35),transparent 60%);pointer-events:none}
.hero-main h1{font-size:clamp(2rem,5.6vw,3.6rem);position:relative}
.hero-main h1 span{background:rgba(255,255,255,.18);backdrop-filter:blur(6px);padding:0 10px;border-radius:10px;display:inline-block}
.hero-main p{max-width:46ch;font-weight:500;margin:16px 0 22px;position:relative;opacity:.92}
.hero-side{background:var(--surface);backdrop-filter:blur(var(--blur)) saturate(140%);color:var(--ink);border:1px solid var(--glass-bd);
  border-radius:var(--r-lg);box-shadow:var(--shadow);padding:26px;display:flex;flex-direction:column;gap:12px;justify-content:center}
.hero-side h2{font-size:1.05rem;color:var(--accent-2)}
.hero-side p{margin:0;font-size:.9rem;opacity:.85}
.vinyl{width:88px;height:88px;border-radius:50%;background:repeating-radial-gradient(circle,#1a0f2e 0 7px,#2d1c48 7px 9px);position:relative;align-self:flex-start;
  box-shadow:0 10px 26px rgba(0,0,0,.4)}
.vinyl::after{content:"";position:absolute;inset:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--p-700))}
@media (max-width:900px){.hero{grid-template-columns:1fr}}
.page-head{margin-bottom:24px}
.page-head h1{font-size:clamp(1.7rem,4.6vw,2.7rem);display:inline-block;background:linear-gradient(135deg,var(--ink),var(--accent-2));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.page-head p{margin:10px 0 0;font-weight:500;opacity:.75}
.section{margin:0 0 38px;min-width:0}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.sec-head h2{font-size:1.25rem}
.sec-head a,.link-btn{font-weight:700;font-size:.78rem;border-radius:999px;padding:8px 14px;background:var(--surface);
  border:1px solid var(--glass-bd);backdrop-filter:blur(var(--blur));text-decoration:none;transition:background .15s,transform .15s}
.sec-head a:hover,.link-btn:hover{background:var(--accent-soft);transform:translateY(-1px)}
.chips{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:10px 16px;border-radius:999px;background:var(--surface);border:1px solid var(--glass-bd);font-weight:600;font-size:.8rem;
  backdrop-filter:blur(var(--blur));min-height:40px;transition:background .15s,transform .15s}
.chip:hover{background:var(--accent-soft);transform:translateY(-1px)}
.chip.active{background:linear-gradient(135deg,var(--accent),var(--p-700));color:#fff;border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:18px}
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,170px);gap:16px;overflow-x:auto;padding:2px 6px 14px 2px;overscroll-behavior-x:contain}
.card{position:relative;min-width:0;background:var(--surface);backdrop-filter:blur(var(--blur)) saturate(140%);border:1px solid var(--glass-bd);
  border-radius:var(--r);box-shadow:var(--shadow-sm);padding:12px;transition:transform .2s,box-shadow .2s,border-color .2s}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:var(--glass-bd-strong)}
.card:active{transform:translateY(-1px)}
.card-link,.card-btn{display:block;width:100%;text-align:left;text-decoration:none}
.card-title{display:block;font-weight:700;margin-top:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-sub{display:block;font-size:.8rem;opacity:.65;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-kind{position:absolute;top:18px;left:18px;background:rgba(10,5,20,.55);backdrop-filter:blur(8px);color:#fff;font-size:.62rem;font-weight:700;
  text-transform:uppercase;letter-spacing:.04em;padding:3px 8px;border-radius:999px;z-index:1}
.card-play{position:absolute;right:16px;top:calc(100% - 4px);}
.thumb{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;display:grid;place-items:center;width:100%;
  background:linear-gradient(145deg,var(--accent),var(--p-700));color:#fff;font-family:var(--font-display);font-size:1.5rem;font-weight:700;user-select:none}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--surface)}
.thumb.round{border-radius:50%}
.thumb.sm{width:52px;font-size:1rem;flex:none;border-radius:10px}
.thumb.xs{width:44px;font-size:.9rem;flex:none;border-radius:8px}
.empty,.state{padding:32px 20px;text-align:center;background:var(--surface);backdrop-filter:blur(var(--blur));border:1px dashed var(--glass-bd-strong);border-radius:var(--r-lg)}
.empty h3,.state h3{font-size:1.05rem;margin-bottom:6px}
.empty p,.state p{margin:0 0 14px;opacity:.75}
.state.err{border-style:solid;background:var(--err-bg);box-shadow:var(--shadow-sm);border-color:transparent}
.spinner{width:32px;height:32px;border:4px solid var(--glass-bd);border-top-color:var(--accent);border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:20px 0 28px}
.detail{display:flex;gap:26px;align-items:flex-end;margin-bottom:8px}
.detail .thumb{width:clamp(130px,22vw,220px);flex:none;box-shadow:var(--shadow-lg);font-size:2.8rem}
.detail h1{font-size:clamp(1.6rem,4.6vw,2.6rem);overflow-wrap:anywhere}
.detail p{margin:8px 0 0;font-weight:500;opacity:.75}
@media (max-width:600px){.detail{flex-direction:column;align-items:flex-start}}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.tile{display:block;text-align:left;padding:18px;border-radius:var(--r);font-family:var(--font-display);font-size:1rem;font-weight:700;
  color:#fff;text-decoration:none;transition:transform .2s,box-shadow .2s;box-shadow:var(--shadow-sm)}
.tile:nth-child(5n+1){background:linear-gradient(145deg,var(--p-600),var(--p-800))}
.tile:nth-child(5n+2){background:linear-gradient(145deg,#c084fc,#7e22ce)}
.tile:nth-child(5n+3){background:linear-gradient(145deg,#ff7ac0,#b43d8f)}
.tile:nth-child(5n+4){background:linear-gradient(145deg,var(--lav),#6b4fd6)}
.tile:nth-child(5n){background:linear-gradient(145deg,#8aa4ff,#4a5fd6)}
.tile:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.tile:active{transform:translateY(-1px)}
.tile small{display:block;font-family:var(--font);font-weight:500;font-size:.76rem;margin-top:4px;opacity:.85}
.hist{display:flex;flex-wrap:wrap;gap:10px}
.notice{padding:14px 18px;background:var(--surface);backdrop-filter:blur(var(--blur));border:1px solid var(--glass-bd);
  border-left:4px solid var(--accent);border-radius:var(--r);margin-bottom:24px;font-weight:600;font-size:.88rem}

/* Rows */
.rows{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:1fr 56px 44px 44px 44px;gap:8px;align-items:center;padding:9px;background:var(--surface);
  backdrop-filter:blur(var(--blur));border:1px solid transparent;border-radius:var(--r);box-shadow:var(--shadow-sm);min-width:0;transition:background .15s,border-color .15s}
.row:hover{background:var(--accent-soft);border-color:var(--glass-bd)}
.row.playing{background:linear-gradient(135deg,var(--accent),var(--p-700));color:#fff;border-color:transparent}
.row.playing .row-sub{color:rgba(255,255,255,.85)}
.row-main{display:flex;gap:12px;align-items:center;min-width:0;text-align:left;width:100%}
.row-text{display:flex;flex-direction:column;min-width:0}
.row-title{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-sub{font-size:.8rem;opacity:.65;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-dur{font-weight:600;font-size:.82rem;text-align:right;opacity:.75}
.row .icon-btn{width:40px;height:40px;box-shadow:none;background:rgba(255,255,255,.05)}
.row .icon-btn .ico{width:19px;height:19px}
@media (max-width:640px){.row{grid-template-columns:1fr 40px 40px 40px;padding:7px}.row-dur{display:none}}

/* Mini player — floating glass dock */

<script>
/* Tema dipasang sebelum halaman dirender agar tidak berkedip. Disimpan di localStorage: ym_accent, ym_mode. */
var YM_ACCENTS=['yellow','blue','green','purple','pink'];
function ymApplyTheme(accent,mode){
  if(YM_ACCENTS.indexOf(accent)<0)accent='purple';if(mode!=='light')mode='dark';
  var r=document.documentElement;r.setAttribute('data-accent',accent);r.setAttribute('data-mode',mode);
  var m=document.querySelector('meta[name="theme-color"]');
  if(m)m.setAttribute('content',getComputedStyle(r).getPropertyValue(mode==='dark'?'--bg':'--accent').trim());
}
(function(){var a,m;try{a=JSON.parse(localStorage.getItem('ym_accent'));m=JSON.parse(localStorage.getItem('ym_mode'))}catch(e){}ymApplyTheme(a,m)})();
</script>

<script>
/* =====================================================================
   YUDAMUSIC — frontend (satu file)
   Arsitektur:
     1. Storage + state global (satu sumber kebenaran)
     2. Helper + ikon
     3. SearchService  -> memanggil /api/search (scraper ytmusic.js ada di server)
     4. PlaybackProvider -> YouTube IFrame Player API (resmi), terpisah dari pencarian
     5. Queue / Library / View / Router / Event
   Catatan: metadata hasil scraper BUKAN sumber audio. videoId hanya dipakai sebagai
   input ke YouTube IFrame Player, tunduk pada aturan embed YouTube.
   ===================================================================== */

/* ---------- 1. Storage + state ---------- */
const LS={
  get(k,def,ok){try{const v=JSON.parse(localStorage.getItem(k));return(v!==null&&v!==undefined&&(!ok||ok(v)))?v:def}catch(e){return def}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};
const isArr=Array.isArray, isObj=v=>v&&typeof v==='object'&&!isArr(v);
const TR={};   // cache semua track yang pernah terlihat (id = videoId)
const ENT={};  // cache artist/album/playlist hasil pencarian (id = browseId)
const S={
  currentTrackIndex:-1, queue:[], ctxOrder:[],
  isPlaying:false, currentTime:0, duration:0, status:'', playError:false,
  volume:LS.get('ym_vol',80,v=>typeof v==='number'&&v>=0&&v<=100), isMuted:false,

const SearchService={
  async search(q,type,signal){
    let r;
    try{r=await fetch('/api/search?q='+encodeURIComponent(q)+'&type='+encodeURIComponent(type),{signal,headers:{Accept:'application/json'}})}
    catch(e){if(e.name==='AbortError')throw e;throw new Error(location.protocol==='file:'?'Backend not reachable. Start it with "npm start" and open http://localhost:3000.':'Cannot reach the backend. Is the server running?')}
    let j;try{j=await r.json()}catch(e){throw new Error('The server returned an invalid response (HTTP '+r.status+').')}
    if(!r.ok||!j||j.status!==true)throw new Error((j&&j.message)||('Server error (HTTP '+r.status+')'));
    if(!isArr(j.items))throw new Error('Unexpected response format from the server.');
    return j.items;
  }
};
function toTrack(it){

  const t={id:it.videoId,youtubeId:it.videoId,title:String(it.title||'Untitled').slice(0,200),artistName:(isArr(it.artists)&&it.artists.length?it.artists.join(', '):'Unknown artist').slice(0,200),
    albumTitle:String(it.album||'').slice(0,200),duration:+it.durationSeconds||0,artwork:safeImg(it.thumbnail),kind:it.kind==='video'?'video':'song'};
  TR[t.id]=Object.assign(TR[t.id]||{},t);return TR[t.id];
}
function toEnt(it){

async function fetchEntities(q,type,signal){

  const out=items.map(it=>songs?toTrack(it):toEnt(it)).filter(Boolean);rememberEnts();return out;

async function runSearch(force){
  const q=SQ.q.replace(/\s+/g,' ').trim();
  if(q.length<2){SQ.status='idle';SQ.ids=[];SQ.lastKey='';renderSearchBody();return}
  const key=SQ.type+'|'+norm(q);SQ.lastKey=key;
  if(!force&&SQ.cache.has(key)){SQ.ids=SQ.cache.get(key);SQ.status=SQ.ids.length?'ok':'empty';renderSearchBody();return}
  if(SQ.ctrl)SQ.ctrl.abort();SQ.ctrl=new AbortController();const my=++SQ.seq;
  SQ.status='loading';renderSearchBody();
  try{
    const res=await fetchEntities(q,SQ.type,SQ.ctrl.signal);if(my!==SQ.seq)return;
    SQ.ids=res.map(x=>x.id);SQ.cache.set(key,SQ.ids);SQ.status=SQ.ids.length?'ok':'empty';
  }catch(e){if(e.name==='AbortError')return;if(my!==SQ.seq)return;SQ.status='error';SQ.error=e.message||'Search failed'}
  renderSearchBody();
}

/* ---------- 4. PlaybackProvider (YouTube IFrame Player API) ----------
   Batasan: tergantung aturan embed YouTube (beberapa video melarang embed, iklan/wilayah berlaku,
   browser mobile bisa butuh tap untuk mulai). Aplikasi ini tidak melewati semua itu.
   Video disembunyikan dengan memindahkannya keluar layar (bukan display:none). */
const PlaybackProvider={
  name:'YouTube IFrame Player API',yt:null,ready:false,failed:false,pending:false,tick:null,guard:null,recordedFor:'',seeking:false,
  init(){
    window.onYouTubeIframeAPIReady=()=>{
      try{this.yt=new YT.Player('ytPlayer',{height:'200',width:'200',playerVars:{playsinline:1,controls:0,disablekb:1,rel:0,modestbranding:1,fs:0},
        events:{onReady:()=>this.onReady(),onStateChange:e=>this.onState(e),onError:e=>this.onError(e)}})}
      catch(e){this.failed=true;S.status='Player failed to start';S.playError=true;syncPlayerUI()}
    };
    const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';s.async=true;
    s.onerror=()=>{this.failed=true;if(currentTrack()){S.status='Player failed to load. Check your connection.';S.playError=true;syncPlayerUI()}};
    document.head.appendChild(s);
  },
  onReady(){
    this.ready=true;this.setVolume();
    if(this.pending){this.pending=false;const t=currentTrack();if(t){S.status='Loading…';this.yt.loadVideoById(t.youtubeId);this.armGuard();syncPlayerUI()}}
  },
  onState(e){
    const P=YT.PlayerState,st=e.data;
    if(st===P.PLAYING){S.isPlaying=true;S.playError=false;S.status='';clearTimeout(this.guard);this.startTick();
      const t=currentTrack();if(t&&this.recordedFor!==t.id){this.recordedFor=t.id;pushRecent(t.id)}}
    else if(st===P.PAUSED){S.isPlaying=false;this.stopTick()}
    else if(st===P.ENDED){S.isPlaying=false;this.stopTick();nextTrack(true)}
    else if(st===P.BUFFERING){S.status='Buffering…'}
    updateProgress();syncPlayerUI();
  },
  onError(e){
    clearTimeout(this.guard);this.stopTick();
    const m={2:'Invalid video ID',5:'Player error',100:'Video not found or private',101:'Embedding disabled by the video owner',150:'Embedding disabled by the video owner',153:'Embedding blocked for this page'}[e.data]||'Unknown error';
    const embedBlocked=(e.data===101||e.data===150);
    S.isPlaying=false;
    const t=currentTrack();
    if(embedBlocked&&t&&!t._scTried){
      // YouTube menolak embed: coba cari lagu yang sama di SoundCloud secara otomatis, sekali per lagu.
      S.playError=false;S.status='Playback unavailable: '+m+' — Looking for this song on SoundCloud…';syncPlayerUI();
      attemptSoundCloudFallback(t);return;
    }
    S.playError=true;S.status='Playback unavailable: '+m;syncPlayerUI();toast('Playback unavailable');
  },
  armGuard(){clearTimeout(this.guard);this.guard=setTimeout(()=>{if(!S.isPlaying&&!S.playError&&/Loading/.test(S.status)){S.status='Press play to start (autoplay was blocked)';S.playError=true;syncPlayerUI()}},4000)},
  load(t){
    this.stopTick();clearTimeout(this.guard);this.recordedFor='';
    if(!this.ready){this.pending=true;S.status=this.failed?'Player failed to load. Check your connection.':'Loading player…';S.playError=this.failed;return}
    S.status='Loading…';try{this.yt.loadVideoById(t.youtubeId)}catch(e){S.status='Player error';S.playError=true}this.armGuard();
  },
  play(){if(this.ready)try{this.yt.playVideo()}catch(e){}else toast(this.failed?'Player failed to load':'Player is still loading')},
  pause(){if(this.ready)try{this.yt.pauseVideo()}catch(e){}},
  seek(s){if(this.ready)try{this.yt.seekTo(s,true)}catch(e){}},
  setVolume(){if(!this.ready)return;try{this.yt.setVolume(S.volume);(S.isMuted||S.volume===0)?this.yt.mute():this.yt.unMute()}catch(e){}},
  getPlaybackState(){if(!this.ready)return{time:S.currentTime,duration:S.duration};try{return{time:this.yt.getCurrentTime()||0,duration:this.yt.getDuration()||0}}catch(e){return{time:0,duration:0}}},
  startTick(){this.stopTick();this.tick=setInterval(updateProgress,500)},
  stopTick(){if(this.tick){clearInterval(this.tick);this.tick=null}}
};

/* ---------- 4b. SoundCloudProvider (fallback, HTML5 Audio) ----------
   Dipakai hanya ketika YouTube menolak embed untuk sebuah lagu ("Embedding disabled
   by the video owner"). Server mencari judul+artis yang sama di SoundCloud
   (lihat /api/soundcloud/match di server.js) dan, jika ketemu, lagu diputar lewat
   elemen <audio> standar memakai URL stream resmi SoundCloud. Mengikuti antarmuka
   yang sama dengan PlaybackProvider supaya kode UI (togglePlay, seekTrack, dst)
   tidak perlu tahu provider mana yang sedang aktif. */
const SoundCloudProvider={
  name:'SoundCloud',el:null,ready:false,seeking:false,tick:null,
  init(){
    this.el=$('#scPlayer');this.ready=true;
    this.el.addEventListener('playing',()=>{S.isPlaying=true;S.playError=false;this.startTick();syncPlayerUI()});
    this.el.addEventListener('pause',()=>{if(!this.el.ended){S.isPlaying=false;this.stopTick();syncPlayerUI()}});
    this.el.addEventListener('ended',()=>{S.isPlaying=false;this.stopTick();nextTrack(true)});
    this.el.addEventListener('waiting',()=>{S.status='Buffering…';syncPlayerUI()});
    this.el.addEventListener('error',()=>{S.isPlaying=false;S.playError=true;this.stopTick();S.status='Playback unavailable on SoundCloud too.';syncPlayerUI();toast('Playback unavailable')});
  },
  load(t){
    this.stopTick();
    if(!t.scStreamUrl){S.status='Player error';S.playError=true;return}
    try{this.el.src=t.scStreamUrl;this.el.volume=(S.isMuted?0:S.volume)/100;this.el.currentTime=0;S.status='Loading…'}
    catch(e){S.status='Player error';S.playError=true}
  },
  play(){if(this.el)this.el.play().catch(()=>{S.status='Press play to start (autoplay was blocked)';S.playError=true;syncPlayerUI()})},
  pause(){if(this.el)this.el.pause()},
  seek(s){if(this.el)try{this.el.currentTime=s}catch(e){}},
  setVolume(){if(this.el)this.el.volume=(S.isMuted||S.volume===0)?0:S.volume/100},
  getPlaybackState(){if(!this.el)return{time:0,duration:0};return{time:this.el.currentTime||0,duration:this.el.duration||0}},
  startTick(){this.stopTick();this.tick=setInterval(updateProgress,500)},
  stopTick(){if(this.tick){clearInterval(this.tick);this.tick=null}}
};
// ActivePlayer: indirection sehingga semua kontrol UI (play/pause/seek/volume) bekerja
// sama persis tanpa peduli lagu sedang diputar lewat YouTube atau fallback SoundCloud.
let ActivePlayer=PlaybackProvider;
const SC_MATCH_CACHE=new Map(); // title+artist -> hasil /api/soundcloud/match, dalam sesi ini saja
async function attemptSoundCloudFallback(t){
  if(!t||t._scTried)return;
  t._scTried=true;
  const key=norm(t.title)+'|'+norm(t.artistName);
  try{
    let match=SC_MATCH_CACHE.get(key);
    if(match===undefined){
      const r=await fetch('/api/soundcloud/match?title='+encodeURIComponent(t.title)+'&artist='+encodeURIComponent(t.artistName),{headers:{Accept:'application/json'}});
      const j=await r.json().catch(()=>null);
      match=(j&&j.status&&j.match)?j.match:null;
      SC_MATCH_CACHE.set(key,match);
    }
    if(currentTrack()!==t)return;   // pengguna sudah pindah lagu selagi menunggu
    if(!match||!match.streamUrl){
      S.playError=true;S.status='Playback unavailable: Embedding disabled by the video owner. No match found on SoundCloud.';syncPlayerUI();toast('Playback unavailable');
      return;
    }
    // Perbarui metadata lagu dengan info yang ditemukan di SoundCloud, dan tandai providernya.
    t.scStreamUrl=match.streamUrl;t.provider='soundcloud';
    t.scArtist=match.artist;t.scTitle=match.title;
    if(match.artwork&&!t.artwork)t.artwork=match.artwork;
    if(match.durationSeconds&&!t.duration)t.duration=match.durationSeconds;
    ActivePlayer=SoundCloudProvider;
    S.status='';S.playError=false;S.currentTime=0;S.duration=t.duration||match.durationSeconds||0;
    SoundCloudProvider.load(t);syncPlayerUI();paintProgress();SoundCloudProvider.play();
    toast('Switched to SoundCloud for this track');
  }catch(e){
    if(currentTrack()!==t)return;
    S.playError=true;S.status='Playback unavailable: Embedding disabled by the video owner.';syncPlayerUI();toast('Playback unavailable');
  }
}

function loadTrack(){
  const t=currentTrack();if(!t)return;
  if(ActivePlayer===SoundCloudProvider)SoundCloudProvider.pause();  // jangan biarkan audio lagu sebelumnya terus jalan
  ActivePlayer=PlaybackProvider;  // lagu baru selalu dicoba dulu lewat YouTube; fallback dievaluasi ulang per lagu
  delete t._scTried;t.provider='youtube';
  S.currentTime=0;S.duration=t.duration||0;S.isPlaying=false;S.status='';S.playError=false;
  PlaybackProvider.load(t);syncPlayerUI();paintProgress();
}
function togglePlay(){
  const t=currentTrack();if(!t)return;
  if(S.playError&&!S.isPlaying){loadTrack();return}   // Retry
  S.isPlaying?ActivePlayer.pause():ActivePlayer.play();
}
function seekTrack(sec){if(!currentTrack())return;ActivePlayer.seek(sec);S.currentTime=sec;paintProgress()}
function setVolume(v){S.volume=Math.max(0,Math.min(100,+v||0));if(S.volume>0)S.isMuted=false;LS.set('ym_vol',S.volume);ActivePlayer.setVolume();paintVolume()}
function toggleMute(){S.isMuted=!S.isMuted;ActivePlayer.setVolume();paintVolume()}
function updateProgress(){
  const t=currentTrack();if(!t){return}
  const st=ActivePlayer.getPlaybackState();
  if(!ActivePlayer.seeking)S.currentTime=st.time;
  if(st.duration>0){S.duration=st.duration;if(!t.duration)t.duration=Math.round(st.duration)}
  paintProgress();
}
function pushRecent(id){S.recentlyPlayed=[id,...S.recentlyPlayed.filter(x=>x!==id)].slice(0,50);LS.set('ym_recent',S.recentlyPlayed);persistTracks()}

/* ---------- 5. Queue ---------- */
function playContext(ids,start=0){
  ids=ids.filter(id=>TR[id]);if(!ids.length){toast('Nothing to play');return}
  S.ctxOrder=ids.slice();const cur=ids[start]||ids[0];
  if(S.shuffleEnabled){S.queue=[cur,...shuffleArr(ids.filter(x=>x!==cur))];S.currentTrackIndex=0}
  else{S.queue=ids.slice();S.currentTrackIndex=ids.indexOf(cur)}
  loadTrack();
}
function nextTrack(auto){
  if(!S.queue.length)return;
  if(auto&&S.repeatMode==='one'){seekTrack(0);ActivePlayer.play();return}
  let i=S.currentTrackIndex+1;
  if(i>=S.queue.length){
    if(S.repeatMode==='all')i=0;
    else if(auto){S.status='End of queue';S.isPlaying=false;syncPlayerUI();return}
    else{toast('No more songs in the queue');return}
  }
  S.currentTrackIndex=i;loadTrack();
}
function previousTrack(){
  if(!S.queue.length)return;
  if(S.currentTime>3||S.currentTrackIndex<=0){seekTrack(0);return}
  S.currentTrackIndex--;loadTrack();
}
function toggleShuffle(){
  S.shuffleEnabled=!S.shuffleEnabled;LS.set('ym_shuffle',S.shuffleEnabled);
  const cur=S.queue[S.currentTrackIndex];
  if(S.queue.length&&cur){
    if(S.shuffleEnabled){S.queue=[cur,...shuffleArr(S.queue.filter((x,i)=>i!==S.currentTrackIndex))];S.currentTrackIndex=0}
    else{const inQ=new Set(S.queue),base=S.ctxOrder.filter(x=>inQ.has(x));S.queue=[...base,...S.queue.filter(x=>!base.includes(x))];S.currentTrackIndex=Math.max(0,S.queue.indexOf(cur))}
  }
  syncPlayerUI();
}
function toggleRepeat(){S.repeatMode=({off:'all',all:'one',one:'off'})[S.repeatMode];LS.set('ym_repeat',S.repeatMode);syncPlayerUI()}
function queueAdd(id,quiet){if(!TR[id])return;if(!S.queue.length){playContext([id]);return}S.queue.push(id);S.ctxOrder.push(id);if(!quiet)toast('Added to queue');syncPlayerUI()}
function queueNext(id){
  if(!TR[id])return;if(!S.queue.length){playContext([id]);return}
  const cur=S.queue[S.currentTrackIndex];S.queue=S.queue.filter((x,i)=>x!==id||i===S.currentTrackIndex);
  S.currentTrackIndex=S.queue.indexOf(cur);S.queue.splice(S.currentTrackIndex+1,0,id);toast('Will play next');syncPlayerUI();

/* ---------- Rekomendasi Home (lokal) ----------

const MOODS=[['Energize','energetic upbeat songs'],['Relax','relaxing chill music'],['Workout','workout music'],['Commute','driving songs'],['Focus','focus study music']];
const REC={cache:new Map(),ttl:10*60*1000};
const primaryArtist=t=>String(t.artistName||'').split(',')[0].trim();
function tasteProfile(){
  const sc=new Map(),add=(t,v)=>{if(!t)return;const a=primaryArtist(t);if(!a||/^unknown artist$/i.test(a))return;const k=norm(a),o=sc.get(k)||{name:a,score:0};o.score+=v;sc.set(k,o)};
  S.likedTracks.forEach(id=>add(TR[id],3));                              // like = sinyal terkuat
  S.playlists.forEach(p=>p.trackIds.forEach(id=>add(TR[id],2)));         // masuk playlist
  S.recentlyPlayed.forEach((id,i)=>add(TR[id],2*(1-i/60)));              // putaran terbaru berbobot lebih besar
  const artists=[...sc.values()].sort((a,b)=>b.score-a.score).slice(0,3),seen=new Set(artists.map(a=>norm(a.name)));
  return {artists,queries:S.searchHistory.filter(q=>!seen.has(norm(q))).slice(0,1)};
}

    section('My Playlists',(S.playlists.length?'<div class="grid">'+S.playlists.map(plCard).join('')+'</div>':empty('No playlists','Create your first playlist.'))+'<p style="margin-top:14px"><button class="btn" data-act="newpl">'+ico('plus')+'Create playlist</button></p>',S.playlists.length?'#/playlists':'')+
    section('Liked Songs',liked.length?rowsHTML(liked.slice(0,5)):empty('No liked songs','Tap the heart on any song.'),liked.length?'#/liked':'')+
    section('Recently Played',rec.length?rowsHTML(rec.slice(0,5)):empty('Nothing played yet','Played songs appear here.'),rec.length?'#/history':'')+
    section('Saved Music',S.saved.length?'<div class="grid">'+S.saved.map(entCard).join('')+'</div>':empty('Nothing saved','Open an artist, album or playlist from search and press Save.'));
}
function viewLiked(){
  const ids=S.likedTracks.filter(x=>TR[x]);
  return '<div class="page-head"><h1>Liked Songs</h1><p>'+plural(ids.length,'song')+'</p></div>'+(ids.length?detailActions(reg(ids))+rowsHTML(ids):empty('No liked songs yet','Tap the heart on any song and it will appear here.'));
}
function viewHistory(){
  const ids=S.recentlyPlayed.filter(x=>TR[x]);
  return '<div class="page-head"><h1>History</h1><p>'+plural(ids.length,'song')+'</p></div>'+(ids.length?detailActions(reg(ids),'<button class="btn red" data-act="clearrecent">Clear history</button>')+rowsHTML(ids):empty('Nothing played yet','Songs that actually start playing appear here.'));
}
function viewPlaylists(){
  return '<div class="page-head"><h1>Playlists</h1></div><div class="actions" style="margin-top:0"><button class="btn" data-act="newpl">'+ico('plus')+'Create playlist</button></div>'+
    (S.playlists.length?'<div class="grid">'+S.playlists.map(plCard).join('')+'</div>':empty('No playlists yet','Playlists you create are saved in this browser.'));
}
function viewPlaylist(id){
  const p=S.playlists.find(x=>x.id===id);if(!p)return empty('Playlist not found','It may have been deleted.','<a class="btn" href="#/playlists">Back to playlists</a>');
  const ids=p.trackIds.filter(x=>TR[x]);
  return '<div class="detail">'+thumbHTML({title:p.name})+'<div style="min-width:0"><p style="margin:0;font-weight:900;text-transform:uppercase">Playlist · saved in this browser</p><h1>'+esc(p.name)+'</h1><p>'+plural(p.trackIds.length,'song')+'</p></div></div>'+
    (ids.length?detailActions(reg(ids),'<button class="btn white" data-act="renamepl" data-id="'+id+'">Rename</button><button class="btn red" data-act="delpl" data-id="'+id+'">Delete</button>'):
      '<div class="actions"><button class="btn white" data-act="renamepl" data-id="'+id+'">Rename</button><button class="btn red" data-act="delpl" data-id="'+id+'">Delete</button></div>')+
    (ids.length?rowsHTML(ids,{pl:id}):empty('This playlist is empty','Search for songs, then use "More options → Add to playlist".','<button class="btn" data-act="gosearch">Search songs</button>'));
}
function viewMenu(){
  return '<div class="page-head"><h1>Menu</h1></div><div class="tiles">'+[['liked','Liked Songs'],['playlists','Playlists'],['history','History'],['settings','Settings']].map(x=>'<a class="tile" href="#/'+x[0]+'">'+x[1]+'</a>').join('')+'</div>';
}
function viewSettings(){
  const acc=[['purple','Purple'],['pink','Pink'],['blue','Periwinkle'],['green','Mint'],['yellow','Lavender']],dark=S.mode==='dark';
  return '<div class="page-head"><h1>Settings</h1></div><div class="set-wrap">'+
    '<section class="panel"><h3>UI Color</h3><p class="set-desc">Choose the accent color used across YudaMusic. Neo Purple is the default.</p><div class="swatches" role="group" aria-label="UI color">'+
      acc.map(a=>'<button class="swatch" data-act="setaccent" data-v="'+a[0]+'" aria-pressed="'+(S.accent===a[0])+'"><i style="--sw:'+(a[0]==='yellow'?'var(--lav)':'var(--c-'+a[0]+')')+'" aria-hidden="true"></i>'+a[1]+'</button>').join('')+'</div></section>'+
    '<section class="panel"><h3>Appearance</h3><p class="set-desc">Switch between Light Mode and Dark Mode.</p><button class="switch" id="darkSw" role="switch" data-act="toggledark" aria-checked="'+dark+'"><span id="darkLbl">'+(dark?'Dark mode':'Light mode')+'</span><span class="knob" aria-hidden="true"></span></button></section>'+
    '<section class="panel"><h3>Player and data</h3><p class="set-desc">Delete Cache clears temporary search data only. Delete History clears search and play history only. Likes, playlists and saved items are kept by both.</p><div class="actions" style="margin:0 0 14px"><button class="btn white" data-act="delcache">Delete Cache</button><button class="btn white" data-act="delhist">Delete History</button><button class="btn red" data-act="resetall">Reset all local data</button></div>'+
    '<p class="muted" style="font-weight:700;margin:0">Playback uses the YouTube player. Some videos cannot be embedded; those show an error with a Retry button.</p></section></div>';
}

/* ---------- Router ---------- */
let routeToken=0;
function route(){
  const h=location.hash.replace(/^#\/?/,'')||'home',parts=h.split('/'),page=parts[0];let arg='';try{arg=decodeURIComponent(parts.slice(1).join('/'))}catch(e){}
  CTX.length=0;S.activePage=page;routeToken++;let html,after=null;
  switch(page){
    case'home':html=viewHome();after=loadReco;break;case'explore':html=viewExplore();break;case'search':html=viewSearch();after=()=>{const q=SQ.q.trim();if(q.length>=2&&SQ.type+'|'+norm(q)!==SQ.lastKey)runSearch(false);else renderSearchBody()};break;
    case'artist':html=viewEntity('artist',arg);after=()=>loadEntityPage('artist',arg);break;
    case'album':html=viewEntity('album',arg);after=()=>loadEntityPage('album',arg);break;
    case'ytpl':html=viewEntity('ytpl',arg);after=()=>loadEntityPage('ytpl',arg);break;
    case'playlist':html=viewPlaylist(arg);break;case'library':html=viewLibrary();break;case'liked':html=viewLiked();break;
    case'history':html=viewHistory();break;case'playlists':html=viewPlaylists();break;case'menu':html=viewMenu();break;case'settings':html=viewSettings();break;
    default:S.activePage='home';html=viewHome();after=loadReco;
  }
  $('#main').innerHTML=html;window.scrollTo(0,0);if(after)after();updateNav();markPlaying();
}
function updateNav(){
  const map={artist:'search',album:'search',ytpl:'search',playlist:'playlists'};const k=map[S.activePage]||S.activePage;
  $$('[data-nav]').forEach(b=>{const on=b.dataset.nav===k;b.classList.toggle('active',on);on?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current')});
}

/* ---------- Menus, modals, library actions ---------- */
let menuAnchor=null,menuItems=[];
function openMenu(anchor,items,head){
  closeMenu();const m=$('#menu');menuAnchor=anchor;menuItems=items;
  m.innerHTML=(head?'<div class="info">'+esc(head)+'</div>':'')+items.map((it,i)=>'<button role="menuitem" data-mi="'+i+'">'+esc(it.label)+'</button>').join('');
  m.classList.add('open');const r=anchor.getBoundingClientRect(),w=m.offsetWidth,h=m.offsetHeight;
  let left=Math.min(Math.max(8,r.right-w),innerWidth-w-8),top=r.bottom+4;if(top+h>innerHeight-8)top=Math.max(8,r.top-h-4);
  m.style.left=left+'px';m.style.top=top+'px';const f=$('button',m);if(f)f.focus();
}
function closeMenu(){const m=$('#menu');if(m.classList.contains('open')){m.classList.remove('open');if(menuAnchor&&document.contains(menuAnchor))menuAnchor.focus({preventScroll:true})}menuAnchor=null}
function trackMenu(btn){
  const t=TR[btn.dataset.id];if(!t)return;
  const it=[{label:'Play next',fn:()=>queueNext(t.id)},{label:'Add to queue',fn:()=>queueAdd(t.id)},{label:'Add to playlist',fn:()=>pickPlaylist(t.id)},
    {label:'Search this artist',fn:()=>{if(S.isFullPlayerOpen)closeFullPlayer();quickSearch(t.artistName.split(',')[0],'songs')}}];
  if(btn.dataset.pl)it.push({label:'Remove from this playlist',fn:()=>{const p=S.playlists.find(x=>x.id===btn.dataset.pl);if(p){p.trackIds=p.trackIds.filter(x=>x!==t.id);savePl();route();toast('Removed from playlist')}}});
  openMenu(btn,it);
}
function openModal(title,body){$('#modal').innerHTML='<div class="scrim" data-act="closemodal"></div><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="mTitle"><h2 id="mTitle">'+title+'</h2>'+body+'</div>';$('#modal').classList.add('open');const f=$('#modal input,#modal button.pk');if(f)f.focus()}
function closeModal(){$('#modal').classList.remove('open');$('#modal').innerHTML=''}
let confirmFn=null;
function confirmModal(title,msg,fn,label){confirmFn=fn;openModal(esc(title),'<p style="margin:0 0 14px;font-weight:700">'+esc(msg)+'</p><div class="dlg-actions"><button class="btn white" data-act="closemodal">Cancel</button><button class="btn red" data-act="confirmok">'+esc(label||'Confirm')+'</button></div>')}
const savePl=()=>{LS.set('ym_playlists',S.playlists);persistTracks()};
function plNameModal(kind,id,addId){
  const p=id?S.playlists.find(x=>x.id===id):null;
  openModal(kind==='rename'?'Rename playlist':'New playlist','<form data-form="'+kind+'" data-id="'+(id||'')+'" data-add="'+(addId||'')+'"><label class="field"><span>Playlist name</span><input name="name" maxlength="50" required autocomplete="off" value="'+esc(p?p.name:'')+'"></label><p class="err" role="alert"></p><div class="dlg-actions"><button type="button" class="btn white" data-act="closemodal">Cancel</button><button class="btn" type="submit">'+(kind==='rename'?'Save':'Create')+'</button></div></form>');
}
function pickPlaylist(id){
  const list=S.playlists.map(p=>'<button class="pk" data-act="pickpl" data-id="'+p.id+'" data-t="'+id+'">'+esc(p.name)+' · '+plural(p.trackIds.length,'song')+'</button>').join('');
  openModal('Add to playlist',(list?'<div class="pick-list">'+list+'</div>':'<p style="font-weight:700">You have no playlists yet.</p>')+'<div class="dlg-actions"><button class="btn white" data-act="closemodal">Cancel</button><button class="btn" data-act="newplfor" data-t="'+id+'">'+ico('plus')+'New playlist</button></div>');
}
function addToPlaylist(pid,tid){
  const p=S.playlists.find(x=>x.id===pid);if(!p||!TR[tid])return;
  if(p.trackIds.includes(tid)){toast('Already in "'+p.name+'"');return}
  p.trackIds.push(tid);savePl();toast('Added to "'+p.name+'"');if(['playlist','library','playlists','home'].includes(S.activePage))route();
}
function validName(n,exceptId){
  n=n.trim().replace(/\s+/g,' ');if(!n)return['','Enter a playlist name.'];if(n.length>50)return['','Name is too long (max 50).'];
  if(S.playlists.some(p=>p.id!==exceptId&&norm(p.name)===norm(n)))return['','You already have a playlist with that name.'];return[n,''];
}
function toggleLike(id){
  if(!TR[id])return;S.likedTracks=isLiked(id)?S.likedTracks.filter(x=>x!==id):[id,...S.likedTracks];LS.set('ym_liked',S.likedTracks);persistTracks();
  $$('[data-act="like"]').forEach(b=>{if(b.dataset.id===id){const l=isLiked(id);b.classList.toggle('liked',l);b.setAttribute('aria-pressed',l);b.setAttribute('aria-label',l?'Unlike':'Like')}});
  if(['liked','library','home'].includes(S.activePage))route();syncPlayerUI();
}
function quickSearch(q,type){SQ.q=q;SQ.type=type||'songs';$('#q').value=q;addHistory(q);if(S.activePage!=='search')location.hash='#/search';else runSearch(false)}
function clearRecent(){S.recentlyPlayed=[];LS.set('ym_recent',[]);persistTracks();if(['history','library','home'].includes(S.activePage))route();toast('History cleared')}

/* ---------- Settings: tema, cache, history ---------- */
function paintTheme(){
  $$('[data-act="setaccent"]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===S.accent));
  const sw=$('#darkSw');if(sw){sw.setAttribute('aria-checked',S.mode==='dark');$('#darkLbl').textContent=S.mode==='dark'?'Dark mode':'Light mode'}
}
function setAccent(v){if(!YM_ACCENTS.includes(v))return;S.accent=v;LS.set('ym_accent',v);ymApplyTheme(S.accent,S.mode);paintTheme()}
function toggleDark(){S.mode=S.mode==='dark'?'light':'dark';LS.set('ym_mode',S.mode);ymApplyTheme(S.accent,S.mode);paintTheme()}
// Cache = hasil pencarian sementara. Likes, playlist, saved, history, dan tema TIDAK disentuh.
function clearCache(){SQ.cache.clear();REC.cache.clear();SQ.lastKey='';try{sessionStorage.removeItem('ym_ent')}catch(e){}toast('Cache deleted')}
// History = riwayat pencarian + riwayat pemutaran saja.
function deleteHistory(){S.searchHistory=[];LS.set('ym_hist',[]);clearRecent()}

/* ---------- Events (delegated, attached once) ---------- */
document.addEventListener('click',function(e){
  const menu=$('#menu');
  if(menu.classList.contains('open')){
    const mi=e.target.closest('[data-mi]');
    if(mi&&menu.contains(mi)){const it=menuItems[+mi.dataset.mi];closeMenu();if(it)it.fn();return}
    if(!menu.contains(e.target)){const a=menuAnchor;menu.classList.remove('open');menuAnchor=null;if(a&&a.contains(e.target))return}
  }
  if(e.target.closest('a[href^="#/"]'))return;
  const el=e.target.closest('[data-act]');if(!el)return;const d=el.dataset,id=d.id;
  switch(d.act){
    case'nav':location.hash=d.href;break;
    case'gosearch':location.hash='#/search';$('#q').focus();break;
    case'dosearch':{const q=$('#q').value;SQ.q=q;if(q.trim().length>=2)addHistory(q);if(S.activePage!=='search')location.hash='#/search';else runSearch(true);break}
    case'quick':quickSearch(d.q,d.type);break;
    case'mood':SQ.q=d.q;SQ.type='songs';$('#q').value=d.q;if(S.activePage!=='search')location.hash='#/search';else runSearch(false);break;
    case'retryreco':route();break;
    case'settype':SQ.type=d.type;location.hash='#/search';if(S.activePage==='search')renderSearchBody();$('#q').focus();break;
    case'stab':SQ.type=d.type;runSearch(false);break;
    case'histq':$('#q').value=d.q;SQ.q=d.q;runSearch(true);break;
    case'clearhist':S.searchHistory=[];LS.set('ym_hist',[]);if(S.activePage==='search')renderSearchBody();toast('Search history cleared');break;
    case'retry':runSearch(true);break;
    case'retryent':route();break;
    case'play':playContext(CTX[+d.ctx]||[],+d.i);break;
    case'playctx':playContext(CTX[+d.ctx]||[],0);break;
    case'shufflectx':{const ids=CTX[+d.ctx]||[];if(!ids.length)break;S.shuffleEnabled=true;LS.set('ym_shuffle',true);playContext(ids,Math.floor(Math.random()*ids.length));break}
    case'queuectx':(CTX[+d.ctx]||[]).forEach(x=>queueAdd(x,true));toast('Added to queue');break;
    case'enqueue':queueAdd(id);break;
    case'like':toggleLike(id);break;
    case'more':trackMenu(el);break;
    case'saveent':{const en=ENT[id];if(!en)break;const s=S.saved.some(x=>x.id===id);S.saved=s?S.saved.filter(x=>x.id!==id):[en,...S.saved];LS.set('ym_saved',S.saved);route();toast(s?'Removed from saved':'Saved');break}
    case'newpl':plNameModal('new');break;case'newplfor':plNameModal('new','',d.t);break;case'renamepl':plNameModal('rename',id);break;
    case'delpl':confirmModal('Delete playlist','This playlist will be removed from this browser.',()=>{S.playlists=S.playlists.filter(p=>p.id!==id);savePl();location.hash='#/playlists';route();toast('Playlist deleted')},'Delete');break;
    case'pickpl':closeModal();addToPlaylist(id,d.t);break;
    case'closemodal':closeModal();break;
    case'confirmok':{const f=confirmFn;confirmFn=null;closeModal();if(f)f();break}
    case'clearrecent':clearRecent();break;
    case'setaccent':setAccent(d.v);break;
    case'toggledark':toggleDark();break;
    case'delcache':confirmModal('Delete cache','This clears saved search results and temporary data. Your likes, playlists, history and settings are kept.',clearCache,'Delete cache');break;
    case'delhist':confirmModal('Delete history','This removes your search history and play history. Your likes, playlists, saved items and settings are kept.',deleteHistory,'Delete history');break;
    case'resetall':confirmModal('Reset local data','This removes likes, playlists, saved items, history and settings from this browser.',()=>{Object.keys(localStorage).filter(k=>k.startsWith('ym_')).forEach(k=>LS.del(k));location.hash='#/home';location.reload()},'Reset');break;
    case'openfull':openFullPlayer();break;case'openqueue':openFullPlayer('queue');break;case'closefull':closeFullPlayer();break;
    case'fullmore':{const t=currentTrack();if(t){el.dataset.id=t.id;trackMenu(el)}break}
    case'toggle':togglePlay();break;case'prev':previousTrack();break;case'next':nextTrack(false);break;
    case'shuffle':toggleShuffle();break;case'repeat':toggleRepeat();break;case'mute':toggleMute();break;
    case'fulltab':S.fullTab=d.tab;syncPlayerUI();break;
    case'qplay':S.currentTrackIndex=+d.i;loadTrack();break;case'qnext':queueMoveNext(+d.i);break;case'qremove':queueRemove(+d.i);break;
    case'qclear':queueClear();break;case'qshuffle':queueShuffle();break;
  }
});
document.addEventListener('submit',function(e){
  const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();const err=$('.err',f),kind=f.dataset.form;
  const [n,m]=validName(f.elements['name'].value,f.dataset.id);if(m){err.textContent=m;return}
  if(kind==='new'){
    const p={id:uid('lp-'),name:n,trackIds:[]};S.playlists.push(p);const add=f.dataset.add;if(add&&TR[add])p.trackIds.push(add);savePl();closeModal();
    toast(add?'Added to "'+n+'"':'Playlist created');if(!add)location.hash='#/playlist/'+p.id;else if(['library','playlists','home'].includes(S.activePage))route();
  }else{const p=S.playlists.find(x=>x.id===f.dataset.id);if(p){p.name=n;savePl()}closeModal();route()}
});
let sTimer;const qEl=$('#q');
qEl.addEventListener('input',function(){
  SQ.q=qEl.value;clearTimeout(sTimer);
  if(S.activePage!=='search'&&qEl.value.trim().length>=2)sTimer=setTimeout(()=>{location.hash='#/search'},450);
  else if(S.activePage==='search')sTimer=setTimeout(()=>runSearch(false),450);   // debounce
});
qEl.addEventListener('keydown',function(e){
  if(e.key==='Enter'){clearTimeout(sTimer);SQ.q=qEl.value;if(SQ.q.trim().length>=2)addHistory(SQ.q);if(S.activePage!=='search')location.hash='#/search';else runSearch(true)}
});
[['#miniSeek'],['#fullSeek']].forEach(([s])=>{
  const el=$(s);
  el.addEventListener('input',function(){ActivePlayer.seeking=true;const v=+el.value;el.style.setProperty('--p',(el.max?v/el.max*100:0)+'%');$('#miniTime').textContent=fmt(v)+' / '+fmt(S.duration);$('#fullCur').textContent=fmt(v)});
  el.addEventListener('change',function(){const v=+el.value;ActivePlayer.seeking=false;seekTrack(v)});
});
['#vol','#fVol'].forEach(s=>$(s).addEventListener('input',function(){setVolume(this.value)}));
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){if($('#menu').classList.contains('open'))closeMenu();else if($('#modal').classList.contains('open'))closeModal();else if(S.isFullPlayerOpen)closeFullPlayer()}
  if(e.key==='Tab'&&S.isFullPlayerOpen&&!$('#modal').classList.contains('open')&&!$('#menu').classList.contains('open')){
    const f=$$('#full button:not([disabled]),#full input:not([disabled])').filter(x=>x.offsetParent!==null);
    if(f.length){const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
  }
});
window.addEventListener('hashchange',route);

/* ---------- Boot ---------- */
function boot(){
  const set=(id,n,label)=>{$(id).innerHTML=ico(n)+(label?'<span>'+label+'</span>':'')};
  set('#n-home','home','Home');set('#n-explore','compass','Explore');set('#n-search','search','Search');set('#n-library','library','Library');
  set('#n-liked','heart','Liked Songs');set('#n-playlists','list','Playlists');set('#n-history','clock','History');set('#n-settings','gear','Settings');
  set('#bn-home','home','Home');set('#bn-explore','compass','Explore');set('#bn-search','search','Search');set('#bn-library','library','Library');set('#bn-settings','gear','Settings');
  $('#logoMark').innerHTML=ico('note');$('#mobLogo').innerHTML=ico('note');$('#b-search').insertAdjacentHTML('afterbegin',ico('search'));
  $('.m-prev').innerHTML=ico('prev');$('.m-next').innerHTML=ico('next');$('#miniQueue').innerHTML=ico('queue');$('#miniExpand').innerHTML=ico('chev').replace('<svg','<svg style="transform:rotate(180deg)"');
  $('#fullClose').innerHTML=ico('chev');$('#fullMore').innerHTML=ico('more');$('#fPrev').innerHTML=ico('prev');$('#fNext').innerHTML=ico('next');$('#fShuffle').innerHTML=ico('shuffle');
  $('#miniLike').innerHTML=ico('heart');$('#fullLike').innerHTML=ico('heart');$('#miniPlay').innerHTML=ico('play');$('#fullPlay').innerHTML=ico('play');
  LS.del('ym_api');   // sisa pengaturan Backend URL yang sudah dihapus
  paintVolume();route();PlaybackProvider.init();SoundCloudProvider.init();
}
boot();
</script>
